[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101",
]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[tool.bandit]
exclude_dirs = ["tests"]

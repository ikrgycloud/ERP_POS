
name: ${COMPOSE_PROJECT_NAME:-erp}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - erp_internal

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${ERP_BACKEND_IMAGE:-erp-backend:local}
    restart: "no"
    environment: &backend_environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: ${APP_NAME:-ERP Backend}
      HOST: 0.0.0.0
      PORT: 8001
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp}
      AUTO_CREATE_TABLES: "false"
      ALLOW_DEV_SEED: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:-}
      REGISTER_KEY: ${REGISTER_KEY:?Set REGISTER_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      ERP_PUBLIC_BASE_URL: ${ERP_PUBLIC_BASE_URL:-http://localhost}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-auto}
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /data/static
      LOG_FILE: /data/logs/erp-backend.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      BACKGROUND_WORKER_INTERVAL: ${BACKGROUND_WORKER_INTERVAL:-10}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-50}
      NOTIFICATION_RETRY_SCHEDULE_SECONDS: ${NOTIFICATION_RETRY_SCHEDULE_SECONDS:-60,300,900,1800,3600,21600}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      DEFAULT_CUSTOMER_COUNTRY_CODE: ${DEFAULT_CUSTOMER_COUNTRY_CODE:-+91}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    command: ["python", "scripts/run_migrations.py"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp_internal

  backend:
    image: ${ERP_BACKEND_IMAGE:-erp-backend:local}
    restart: unless-stopped
    environment: *backend_environment
    volumes:
      - backend_uploads:/data/uploads
      - backend_logs:/data/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp_internal

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-same-origin}
    image: ${ERP_WEB_IMAGE:-erp-web:local}
    restart: unless-stopped
    environment:
      ERP_API_UPSTREAM: http://backend:8001
      ERP_CLIENT_MAX_BODY_SIZE: ${ERP_CLIENT_MAX_BODY_SIZE:-10m}
      PORT: 80
    ports:
      - "${ERP_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - erp_internal

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:

networks:
  erp_internal:
    driver: bridge
